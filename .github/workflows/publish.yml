# Publishes this n8n community node package to npm when a GitHub release is
# published, then opens a pull request that bumps main to the next minor
# version.
#
# ─── HOW A RELEASE RUNS ────────────────────────────────────────────────────────
#
# `version` in package.json on main is always the version under development,
# the one the next release will publish. Publishing a GitHub release whose
# tag is that bare version (0.3.0, not v0.3.0) runs this workflow:
#
#   ci, e2e  the CI and E2E workflows, on the tagged commit.
#   publish  checks that the tag equals package.json, then runs
#            `npm run release`. In GitHub Actions, `n8n-node release` lints,
#            builds and runs `npm publish` with provenance. It does not bump,
#            commit or tag. A release marked pre-release publishes under the
#            npm dist-tag `next` instead of `latest`.
#   bump     after a successful publish of a normal release, bumps main to the
#            next minor version and opens a pull request for it. Merging that
#            pull request is what makes the next release possible.
#
# When a run fails before `npm publish`, fix main and start the workflow by
# hand (Actions → Publish → Run workflow) with the tag of the existing
# release. It runs the same jobs on that tag; nothing has to be deleted.
#
# The pull request is opened with GITHUB_TOKEN unless a RELEASE_PR_TOKEN
# secret exists. GitHub does not run workflows for pull requests that
# GITHUB_TOKEN opens, so CI will not run on the bump pull request; with a
# fine-grained token or GitHub App token in RELEASE_PR_TOKEN (contents and
# pull requests: write) it does.
#
# See "Releasing" in CONTRIBUTING.md for the steps a maintainer takes.

name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of an existing GitHub release to publish, for example 0.3.0'
        required: true
        type: string

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.event.release.tag_name || inputs.tag }}
    secrets: inherit
    permissions:
      contents: read

  e2e:
    name: E2E
    uses: ./.github/workflows/e2e.yml
    with:
      ref: ${{ github.event.release.tag_name || inputs.tag }}
    secrets: inherit
    permissions:
      contents: read

  publish:
    name: Publish to npm
    needs: [ci, e2e]
    runs-on: ubuntu-latest

    permissions:
      # Mints the OIDC token npm needs for Trusted Publishing and provenance.
      id-token: write
      contents: read

    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    outputs:
      prerelease: ${{ steps.release.outputs.prerelease }}
      url: ${{ steps.release.outputs.url }}

    steps:
      - name: Read the GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease,url \
            --jq '"prerelease=\(.isPrerelease)\nurl=\(.url)"' >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}

      - name: Check that the release tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "$version" ]; then
            echo "::error::Release tag '$RELEASE_TAG' does not match package.json version '$version' on the tagged commit. Nothing was published. Delete the release and its tag, fix the version on main, and publish again."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      - name: Publish
        run: 'npm run release'
        env:
          NPM_CONFIG_TAG: ${{ steps.release.outputs.prerelease == 'true' && 'next' || 'latest' }}
          # Prints the `npm verbose oidc` lines that say why Trusted Publishing failed.
          NPM_CONFIG_LOGLEVEL: verbose

  bump:
    name: Open the next-version pull request
    needs: publish
    if: needs.publish.outputs.prerelease != 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.RELEASE_PR_TOKEN || github.token }}

      - name: Bump to the next minor version
        id: bump
        run: |
          current="$(node -p "require('./package.json').version")"
          if [ "$current" != "$RELEASE_TAG" ]; then
            echo "::warning::main is at $current, not at the released $RELEASE_TAG, so there is nothing to bump."
            echo "next=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          next="$(npm version minor --no-git-tag-version)"
          echo "next=${next#v}" >> "$GITHUB_OUTPUT"

      - name: Push the branch and open the pull request
        if: steps.bump.outputs.next != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
          NEXT: ${{ steps.bump.outputs.next }}
          RELEASE_URL: ${{ needs.publish.outputs.url }}
        run: |
          branch="release/bump-$NEXT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add package.json package-lock.json
          git commit -m "Bump the version to $NEXT"
          git push --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')" ]; then
            gh pr create --base main --head "$branch" \
              --title "Bump the version to $NEXT" \
              --body "$RELEASE_TAG is published ($RELEASE_URL). This sets \`version\` in package.json and package-lock.json to $NEXT, the next minor version, so that the next release can be published from the Releases screen with the tag \`$NEXT\`. Opened by the Publish workflow."
          fi
