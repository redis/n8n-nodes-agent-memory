site_name: Redis Agent Memory for n8n
site_description: Memory for n8n AI Agents, backed by Redis Agent Memory
site_author: Redis
site_url: https://redis.github.io/n8n-nodes-agent-memory

repo_name: redis/n8n-nodes-agent-memory
repo_url: https://github.com/redis/n8n-nodes-agent-memory
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  logo: logo.svg
  favicon: logo-dark.svg
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - git-revision-date-localized:
      # The creation date is off: for a page with no git history yet, the
      # plugin samples the build date twice and warns when the two differ,
      # which makes a local strict build of a new page fail at random.
      enable_creation_date: false
      enable_git_follow: false
      fallback_to_build_date: true
      strict: false

# Strict mode (CI) fails on these; MkDocs only logs them by default.
validation:
  nav:
    omitted_files: warn
  links:
    anchors: warn

# Internal working documents live in docs/ too; they are not part of the site.
exclude_docs: |
  design-draft.md
  0.3.0-features.md
  testing.md
  requirements.txt

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quick-start.md
  - User Guide:
    - Users, Sessions and Namespaces: guide/data-model.md
    - Chat Memory: guide/chat-memory.md
    - Action Node and Tools: guide/action-node.md
    - Summary Views: guide/summary-views.md
    - Memory Sources: guide/provenance.md
  - Examples: examples.md
  - Reference:
    - Operations: reference/operations.md
  - Development: development.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/redis/n8n-nodes-agent-memory
    - icon: fontawesome/brands/npm
      link: https://www.npmjs.com/package/@redis/n8n-nodes-agent-memory
  version:
    provider: mike

extra_css:
  - stylesheets/extra.css
